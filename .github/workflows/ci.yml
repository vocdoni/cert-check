name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  # Only superseded pull request runs are cancelled: a cancelled run on main
  # would leave that commit without a green check, so Railway would never deploy it.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  ci:
    runs-on: [self-hosted, ci]
    timeout-minutes: 30
    # No CGO_ENABLED=0 at job level: the race detector needs cgo. The pure-Go
    # build is checked by its own step and by the Dockerfile.
    env:
      GOFLAGS: -mod=readonly
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.27.x"
          cache: true
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: go mod tidy
        run: go mod tidy -diff
      - name: vet
        run: go vet ./... && go vet -tags live ./...
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...
      - name: build (pure Go, no cgo)
        run: CGO_ENABLED=0 go build -trimpath ./...
      - name: test
        run: |
          go test -race -count=1 -json ./... > test.json || (grep -E '"Action":"fail"' test.json | head -50; exit 1)
          skipped="$(grep '"Action":"skip"' test.json | grep -c '"Test":' || true)"
          test "$skipped" = "0"
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: fuzz smoke (30 s per target)
        run: |
          for t in FuzzParseName FuzzParseSANDirectoryNames FuzzParseDateOfBirth FuzzParseDocument; do
            go test -run '^$' -fuzz "^$t\$" -fuzztime 30s ./certauth/identity || exit 1
          done
          for t in FuzzParseResponse FuzzParseIDP FuzzParseCDP; do
            go test -run '^$' -fuzz "^$t\$" -fuzztime 30s ./certauth/revocation || exit 1
          done
          go test -run '^$' -fuzz '^FuzzParseQCStatements$' -fuzztime 30s ./certauth || exit 1
      - name: AC12 certauth has no app dependencies
        run: |
          if go list -deps ./certauth/... | grep -E 'github.com/vocdoni/cert-check/(internal|web)'; then exit 1; fi
          if go list -f '{{.ImportPath}}: {{join .Imports " "}}' ./... | grep -v '^github.com/vocdoni/cert-check/internal/testpki' | grep 'internal/testpki'; then exit 1; fi
      - name: docker build
        run: |
          if ! command -v docker >/dev/null 2>&1; then
            echo "::warning title=docker build skipped::docker is not installed on this runner, so the image build was not checked"
            exit 0
          fi
          docker build --pull -t cert-check:ci .
          docker image rm cert-check:ci
